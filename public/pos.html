<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>주섬주섬 카페</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7a4a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주섬주섬 카페">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <h1>☕ 주섬주섬 카페</h1>
  <div class="header-right">
    <span id="deviceLabel" style="font-size:11px; opacity:.8;"></span>
    <span id="clock"></span>
    <button id="themeBtn" title="테마 변경">🌓</button>
    <div class="nav-wrap">
      <button class="nav-btn" id="navBtn">☰</button>
      <div class="nav-menu" id="navMenu" hidden>
        <a href="/">🏠 홈</a>
        <a href="/pos.html" class="current">🧾 계산대</a>
        <a href="/entry.html">🧮 구매·지출 입력</a>
        <a href="/brew.html">🍵 브루 보드</a>
        <a href="/admin">🛠️ 관리자</a>
      </div>
    </div>
  </div>
</header>

<div class="main-tabs">
  <div class="main-tab active" data-view="order">🧾 새 주문</div>
  <div class="main-tab" data-view="history">📋 오늘 주문</div>
</div>

<div id="view-order">
  <div class="layout">
    <div class="left">
      <div class="grid" id="grid"></div>
    </div>

    <div class="right">
      <div class="ticket-head">
        <h2>주문 내역</h2>
        <span class="clear" id="clearBtn">비우기</span>
      </div>
      <div class="ticket-body" id="ticketBody"></div>
      <div class="ticket-foot">
        <div class="sum-row total"><span>합계</span><span id="totalValue">RM0.00</span></div>
        <div class="pay-row" id="payRow"></div>
        <div class="action-row">
          <button id="submitBtn" class="btn btn-primary">제출</button>
        </div>
        <div id="toast" class="toast" hidden></div>
      </div>
    </div>
  </div>
</div>

<div id="view-history" hidden>
  <div class="recent-panel">
    <div class="recent-head">
      <h2>오늘 주문 내역</h2>
      <span id="recentRefresh" class="clear">새로고침 ↻</span>
    </div>
    <div class="recent-summary" id="recentSummary"></div>
    <div class="recent-body" id="recentBody"></div>
  </div>
</div>

<script>
  // Each till can be labeled once (e.g. "카운터1") so the admin page can
  // tell which device an order came from. Stored per-device in localStorage.
  function getDeviceName() {
    var KEY = 'cafe-device-name';
    var name = localStorage.getItem(KEY);
    if (!name) {
      name = (window.prompt('이 기기 이름을 입력해주세요 (예: 카운터1)', '카운터1') || '').trim() || '이름없는 기기';
      localStorage.setItem(KEY, name);
    }
    return name;
  }
  var DEVICE_NAME = getDeviceName();

  var MENU = [];
  var cart = {};
  var payMethod = null;
  var PAY_OPTIONS = ['현금', '터치앤고'];
  var submitting = false;

  function fmt(n) {
    return 'RM' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderClock() {
    var el = document.getElementById('clock');
    var d = new Date();
    el.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  // Picks the largest square tile size + column count that fits every menu
  // item in the visible area with no scrolling, so a bigger menu shrinks
  // the buttons instead of overflowing.
  function fitMenuGrid() {
    var left = document.querySelector('#view-order .left');
    var grid = document.getElementById('grid');
    var n = MENU.length;
    if (!left || !grid || !n) return;
    var cs = getComputedStyle(left);
    var W = left.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    var H = left.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
    var gap = 10;
    var bestCols = 1, bestTile = 0;
    for (var cols = 1; cols <= n; cols++) {
      var tileW = (W - gap * (cols - 1)) / cols;
      if (tileW <= 0) continue;
      var rows = Math.ceil(n / cols);
      var totalH = rows * tileW + gap * (rows - 1);
      if (totalH <= H && tileW > bestTile) { bestTile = tileW; bestCols = cols; }
    }
    if (bestTile === 0) {
      // Too many items for this screen even at a sane minimum — fall back
      // to a reasonable column count; .left can still scroll as a last resort.
      bestCols = Math.max(2, Math.floor(W / 90)) || 2;
      bestTile = (W - gap * (bestCols - 1)) / bestCols;
    }
    grid.style.setProperty('--cols', bestCols);
    grid.style.setProperty('--tile-px', bestTile + 'px');
  }

  var fitMenuGridRaf = null;
  function scheduleFitMenuGrid() {
    if (fitMenuGridRaf) cancelAnimationFrame(fitMenuGridRaf);
    fitMenuGridRaf = requestAnimationFrame(fitMenuGrid);
  }
  window.addEventListener('resize', scheduleFitMenuGrid);
  window.addEventListener('orientationchange', scheduleFitMenuGrid);

  function renderGrid() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    MENU.forEach(function (it) {
      var btn = document.createElement('div');
      btn.className = 'item-btn';
      btn.innerHTML =
        '<div class="item-emoji">' + it.emoji + '</div>' +
        '<div class="item-name"></div>' +
        '<div class="item-price">' + fmt(it.price) + '</div>';
      btn.querySelector('.item-name').textContent = it.name;
      var qty = cart[it.id] || 0;
      if (qty > 0) {
        var badge = document.createElement('div');
        badge.className = 'item-qty-badge';
        badge.textContent = qty;
        btn.appendChild(badge);
      }
      btn.addEventListener('click', function () {
        cart[it.id] = (cart[it.id] || 0) + 1;
        render();
      });
      grid.appendChild(btn);
    });
  }

  function renderTicket() {
    var body = document.getElementById('ticketBody');
    body.innerHTML = '';
    var entries = Object.keys(cart).filter(function (k) { return cart[k] > 0; });
    if (entries.length === 0) {
      body.innerHTML = '<div class="ticket-empty">메뉴를 선택해주세요</div>';
      return;
    }
    entries.forEach(function (id) {
      var it = MENU.find(function (x) { return x.id === id; });
      if (!it) return;
      var qty = cart[id];
      var row = document.createElement('div');
      row.className = 'ticket-row';
      row.innerHTML =
        '<span class="emoji">' + it.emoji + '</span>' +
        '<span class="name"></span>' +
        '<span class="stepper">' +
          '<button data-act="dec" data-id="' + id + '">−</button>' +
          '<span class="qty">' + qty + '</span>' +
          '<button data-act="inc" data-id="' + id + '">+</button>' +
        '</span>' +
        '<span class="amount">' + fmt(it.price * qty) + '</span>';
      row.querySelector('.name').textContent = it.name;
      body.appendChild(row);
    });
    body.querySelectorAll('button[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-id');
        var act = b.getAttribute('data-act');
        if (act === 'inc') cart[id] = (cart[id] || 0) + 1;
        else cart[id] = Math.max(0, (cart[id] || 0) - 1);
        render();
      });
    });
  }

  function renderPay() {
    var row = document.getElementById('payRow');
    row.innerHTML = '';
    PAY_OPTIONS.forEach(function (p) {
      var chip = document.createElement('div');
      chip.className = 'pay-chip' + (payMethod === p ? ' selected' : '');
      chip.textContent = (p === '현금' ? '💵 ' : '📱 ') + p;
      chip.addEventListener('click', function () { payMethod = p; render(); });
      row.appendChild(chip);
    });
  }

  function total() {
    return MENU.reduce(function (sum, it) { return sum + it.price * (cart[it.id] || 0); }, 0);
  }

  function renderFooter() {
    var t = total();
    document.getElementById('totalValue').textContent = fmt(t);
    var btn = document.getElementById('submitBtn');
    var ok = t > 0 && payMethod && !submitting;
    btn.classList.toggle('active', ok);
    btn.disabled = !ok;
  }

  function render() {
    renderGrid();
    renderTicket();
    renderPay();
    renderFooter();
    scheduleFitMenuGrid();
  }

  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    t.className = 'toast' + (isError ? ' error' : '');
    setTimeout(function () { t.hidden = true; }, 2200);
  }

  async function submitOrder() {
    if (submitting) return;
    submitting = true; render();
    var items = Object.keys(cart).filter(function (k) { return cart[k] > 0; }).map(function (id) {
      var it = MENU.find(function (x) { return x.id === id; });
      return { id: id, name: it.name, price: it.price, qty: cart[id] };
    });
    try {
      var res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: items, total: total(), pay: payMethod, device: DEVICE_NAME })
      });
      if (!res.ok) throw new Error('save failed');
      showToast('주문이 저장됐어요 ✓');
      cart = {}; payMethod = null;
    } catch (e) {
      showToast('저장 실패 - 다시 시도해주세요', true);
    } finally {
      submitting = false; render();
    }
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    cart = {}; payMethod = null; render();
  });
  document.getElementById('submitBtn').addEventListener('click', submitOrder);

  function renderSummary(orders) {
    var summaryEl = document.getElementById('recentSummary');
    var totalRevenue = orders.reduce(function (s, o) { return s + o.total; }, 0);
    var counts = {}; // name -> { qty, amount }
    orders.forEach(function (o) {
      o.items.forEach(function (it) {
        if (!counts[it.name]) counts[it.name] = { qty: 0, amount: 0 };
        counts[it.name].qty += it.qty;
        counts[it.name].amount += it.price * it.qty;
      });
    });
    var names = Object.keys(counts).sort(function (a, b) { return counts[b].qty - counts[a].qty; });
    var rowsHtml = names.map(function (name) {
      return '<tr><td></td><td class="qty">' + counts[name].qty + '개</td><td class="amt">' + fmt(counts[name].amount) + '</td></tr>';
    }).join('');
    summaryEl.innerHTML =
      '<div class="big-total-label">오늘 전체 매출</div>' +
      '<div class="big-total">' + fmt(totalRevenue) + '</div>' +
      '<table class="item-count-table"><tbody>' + rowsHtml + '</tbody></table>';
    var nameCells = summaryEl.querySelectorAll('.item-count-table td:first-child');
    names.forEach(function (name, i) { nameCells[i].textContent = name; });
  }

  async function loadRecent() {
    var body = document.getElementById('recentBody');
    body.innerHTML = '<div class="recent-empty">불러오는 중...</div>';
    try {
      var res = await fetch('/api/orders?limit=50');
      var orders = await res.json();
      renderSummary(orders);
      if (orders.length === 0) {
        body.innerHTML = '<div class="recent-empty">오늘 주문이 아직 없어요</div>';
        return;
      }
      body.innerHTML = orders.map(function (o) {
        var time = o.createdAt.slice(11, 19);
        var desc = o.items.map(function (i) { return i.name + ' x' + i.qty; }).join(', ');
        return '<div class="recent-row"><div class="top"><span>' + time + (o.pay ? ' · ' + o.pay : '') + '</span><span>' + fmt(o.total) + '</span></div><div class="desc"></div></div>';
      }).join('');
      // fill descriptions as text to avoid HTML injection from stored memo/item names
      var rows = body.querySelectorAll('.recent-row .desc');
      orders.forEach(function (o, i) {
        rows[i].textContent = o.items.map(function (it) { return it.name + ' x' + it.qty; }).join(', ');
      });
    } catch (e) {
      body.innerHTML = '<div class="recent-empty">불러오지 못했어요</div>';
    }
  }
  document.getElementById('recentRefresh').addEventListener('click', loadRecent);

  document.getElementById('navBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    document.getElementById('navMenu').hidden = !document.getElementById('navMenu').hidden;
  });
  document.addEventListener('click', function () {
    document.getElementById('navMenu').hidden = true;
  });

  document.querySelectorAll('.main-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.main-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      var view = tab.getAttribute('data-view');
      document.getElementById('view-order').hidden = view !== 'order';
      document.getElementById('view-history').hidden = view !== 'history';
      if (view === 'history') loadRecent();
    });
  });

  async function init() {
    var deviceLabelEl = document.getElementById('deviceLabel');
    deviceLabelEl.textContent = '📍 ' + DEVICE_NAME;
    deviceLabelEl.style.cursor = 'pointer';
    deviceLabelEl.title = '탭하면 기기 이름 변경';
    deviceLabelEl.addEventListener('click', function () {
      var next = (window.prompt('기기 이름 변경', DEVICE_NAME) || '').trim();
      if (next) {
        DEVICE_NAME = next;
        localStorage.setItem('cafe-device-name', next);
        deviceLabelEl.textContent = '📍 ' + DEVICE_NAME;
      }
    });
    var res = await fetch('/api/menu');
    MENU = await res.json();
    renderClock();
    setInterval(renderClock, 30000);
    render();
  }

  init();
</script>
</body>
</html>
