<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>주섬주섬 카페</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7a4a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주섬주섬 카페">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <h1>☕ 주섬주섬 카페</h1>
  <div class="header-right">
    <span id="deviceLabel" style="font-size:11px; opacity:.8;"></span>
    <span id="clock"></span>
    <button id="themeBtn" title="테마 변경">🌓</button>
    <div class="nav-wrap">
      <button class="nav-btn" id="navBtn">☰</button>
      <div class="nav-menu" id="navMenu" hidden>
        <a href="/">🏠 홈</a>
        <a href="/pos.html" class="current">🧾 계산대</a>
        <a href="/brew.html">🍵 브루 보드</a>
        <a href="/entry.html">🧮 구매·지출 입력</a>
        <a href="/admin">🛠️ 관리자</a>
      </div>
    </div>
  </div>
</header>

<div class="main-tabs">
  <div class="main-tab active" data-view="order">🧾 새 주문</div>
  <div class="main-tab" data-view="history">📋 오늘 주문</div>
</div>

<div id="view-order">
  <div class="layout">
    <div class="left">
      <div class="grid" id="grid"></div>
    </div>

    <div class="right">
      <div class="ticket-head">
        <h2>주문 내역</h2>
        <span class="clear" id="clearBtn">비우기</span>
      </div>
      <div class="ticket-body" id="ticketBody"></div>
      <div class="ticket-foot">
        <div class="sum-row total"><span>합계</span><span id="totalValue">RM0.00</span></div>
        <div class="pay-row" id="payRow"></div>
        <div class="action-row">
          <button id="submitBtn" class="btn btn-primary">제출</button>
        </div>
        <div id="toast" class="toast" hidden></div>
      </div>
    </div>
  </div>
</div>

<div id="view-history" hidden>
  <div class="recent-panel">
    <div class="recent-head">
      <h2>오늘 주문 내역</h2>
      <span id="recentRefresh" class="clear">새로고침 ↻</span>
    </div>
    <div class="recent-summary" id="recentSummary"></div>
    <div class="recent-body" id="recentBody"></div>
  </div>
</div>

<script>
  // Each till is auto-labeled from its browser/OS (e.g. "iPad", "Galaxy Tab")
  // so the admin page can tell devices apart with no setup. A short random
  // tag is added so two of the same model still show up as different tills.
  // Stored in localStorage so the same device keeps its name across visits;
  // tap the 📍 label in the header any time to rename it by hand instead.
  function detectDeviceModel() {
    var ua = navigator.userAgent || '';
    if (/iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/Android/.test(ua)) {
      var m = ua.match(/Android\s[^;]+;\s*([^)]+)\)/);
      if (m && m[1]) {
        var model = m[1].split('Build')[0].trim();
        if (/SM-T|Tab/i.test(model)) return 'Galaxy Tab';
        if (model) return model;
      }
      return 'Android 기기';
    }
    if (/Macintosh/.test(ua)) return 'Mac';
    if (/Windows/.test(ua)) return 'Windows PC';
    return '기기';
  }
  function getDeviceName() {
    var KEY = 'cafe-device-name';
    var name = localStorage.getItem(KEY);
    if (!name) {
      var tag = Math.random().toString(36).slice(2, 6);
      name = detectDeviceModel() + ' #' + tag;
      localStorage.setItem(KEY, name);
    }
    return name;
  }
  var DEVICE_NAME = getDeviceName();

  var MENU = [];
  var cart = {};
  var payMethod = null;
  var PAY_OPTIONS = ['현금', '터치앤고', 'Free'];
  var submitting = false;

  function fmt(n) {
    return 'RM' + n.toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderClock() {
    var el = document.getElementById('clock');
    var d = new Date();
    el.textContent = window.cafeTime.hm(d);
  }

  // Picks the largest square tile size + column count that fits every menu
  // item in the visible area with no scrolling, so a bigger menu shrinks
  // the buttons instead of overflowing.
  function fitMenuGrid() {
    var left = document.querySelector('#view-order .left');
    var grid = document.getElementById('grid');
    var n = MENU.length;
    if (!left || !grid || !n) return;
    var cs = getComputedStyle(left);
    var W = left.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0);
    var H = left.clientHeight - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0);
    var gap = 10;
    var bestCols = 1, bestTile = 0;
    for (var cols = 1; cols <= n; cols++) {
      var tileW = (W - gap * (cols - 1)) / cols;
      if (tileW <= 0) continue;
      var rows = Math.ceil(n / cols);
      var totalH = rows * tileW + gap * (rows - 1);
      if (totalH <= H && tileW > bestTile) { bestTile = tileW; bestCols = cols; }
    }
    var MAX_TILE_PX = 190; // keep tiles from ballooning when there's lots of spare room
    if (bestTile > MAX_TILE_PX) {
      // Not just a font-size cap — recompute columns so tiles are actually
      // this size, not just stretched squares with small text floating in them.
      bestCols = Math.max(1, Math.ceil((W + gap) / (MAX_TILE_PX + gap)));
      bestTile = (W - gap * (bestCols - 1)) / bestCols;
    }
    if (bestTile === 0) {
      // Too many items for this screen even at a sane minimum — fall back
      // to a reasonable column count; .left can still scroll as a last resort.
      bestCols = Math.max(2, Math.floor(W / 90)) || 2;
      bestTile = (W - gap * (bestCols - 1)) / bestCols;
    }
    grid.style.setProperty('--cols', bestCols);
    grid.style.setProperty('--tile-px', bestTile + 'px');
  }

  var fitMenuGridRaf = null;
  function scheduleFitMenuGrid() {
    if (fitMenuGridRaf) cancelAnimationFrame(fitMenuGridRaf);
    fitMenuGridRaf = requestAnimationFrame(fitMenuGrid);
  }
  window.addEventListener('resize', scheduleFitMenuGrid);
  window.addEventListener('orientationchange', scheduleFitMenuGrid);

  // Tile elements are created once and reused (not rebuilt from scratch on
  // every render) so they can be smoothly animated between positions —
  // the same trick behind the iOS home-screen "rearrange apps" feel.
  var tileEls = {}; // id -> element

  function makeTileEl(it) {
    var btn = document.createElement('div');
    btn.className = 'item-btn';
    btn.setAttribute('data-id', it.id);
    btn.innerHTML =
      '<div class="item-emoji">' + it.emoji + '</div>' +
      '<div class="item-name"></div>' +
      '<div class="item-price">' + fmt(it.price) + '</div>';
    btn.querySelector('.item-name').textContent = it.name;
    bindItemBtnPress(btn, it);
    return btn;
  }

  function renderGrid() {
    var grid = document.getElementById('grid');
    var validIds = {};
    MENU.forEach(function (it) { validIds[it.id] = true; });
    Object.keys(tileEls).forEach(function (id) {
      if (!validIds[id]) { tileEls[id].remove(); delete tileEls[id]; }
    });
    MENU.forEach(function (it) {
      var el = tileEls[it.id];
      if (!el) { el = makeTileEl(it); tileEls[it.id] = el; }
      var badge = el.querySelector('.item-qty-badge');
      var qty = cart[it.id] || 0;
      if (qty > 0) {
        if (!badge) {
          badge = document.createElement('div');
          badge.className = 'item-qty-badge';
          el.appendChild(badge);
        }
        badge.textContent = qty;
      } else if (badge) {
        badge.remove();
      }
      grid.appendChild(el); // moves it into the right slot; order mismatches animate via reflow() during drag
    });
  }

  // FLIP animation: measure where tiles are now, re-sort the DOM to match
  // the current MENU order, then play a transform from their old spot to
  // their new one — this is what makes the other tiles glide out of the
  // way instead of jumping. The actively dragged tile (position: fixed,
  // following the finger) is excluded.
  function reflow(exceptId) {
    var grid = document.getElementById('grid');
    var firstRects = {};
    Object.keys(tileEls).forEach(function (id) {
      if (id !== exceptId) firstRects[id] = tileEls[id].getBoundingClientRect();
    });
    MENU.forEach(function (it) { grid.appendChild(tileEls[it.id]); });
    Object.keys(firstRects).forEach(function (id) {
      var el = tileEls[id];
      var last = el.getBoundingClientRect();
      var dx = firstRects[id].left - last.left;
      var dy = firstRects[id].top - last.top;
      if (dx || dy) {
        el.style.transition = 'none';
        el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            el.style.transition = 'transform 220ms ease';
            el.style.transform = '';
          });
        });
      }
    });
  }

  // A quick tap adds the item to the order, same as before. Pressing and
  // holding for ~450ms instead picks the tile up — it follows your finger
  // and the other tiles slide aside live, like rearranging iOS home-screen
  // icons — and letting go drops it (and saves the new order).
  var dragState = null; // { id, el, offsetX, offsetY }
  function bindItemBtnPress(btn, it) {
    var longPressTimer = null;
    var startX = 0, startY = 0;
    var MOVE_CANCEL_PX = 10;

    btn.addEventListener('pointerdown', function (e) {
      if (dragState) return; // a drag from another tile is still finishing up
      startX = e.clientX; startY = e.clientY;
      longPressTimer = setTimeout(function () {
        longPressTimer = null;
        startDrag(it.id, btn, startX, startY);
      }, 450);
    });

    btn.addEventListener('pointermove', function (e) {
      if (longPressTimer && (Math.abs(e.clientX - startX) > MOVE_CANCEL_PX || Math.abs(e.clientY - startY) > MOVE_CANCEL_PX)) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    });

    btn.addEventListener('pointerup', function () {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
        if (!dragState) {
          cart[it.id] = (cart[it.id] || 0) + 1;
          render();
        }
      }
    });

    btn.addEventListener('pointercancel', function () {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    });
  }

  function startDrag(id, el, clientX, clientY) {
    var rect = el.getBoundingClientRect();
    dragState = { id: id, el: el, offsetX: clientX - rect.left, offsetY: clientY - rect.top };
    el.style.position = 'fixed';
    el.style.left = rect.left + 'px';
    el.style.top = rect.top + 'px';
    el.style.width = rect.width + 'px';
    el.style.height = rect.height + 'px';
    el.style.margin = '0';
    el.style.pointerEvents = 'none';
    el.classList.add('dragging');
    document.getElementById('grid').classList.add('reordering');
  }

  document.addEventListener('pointermove', function (e) {
    if (!dragState) return;
    e.preventDefault();
    dragState.el.style.left = (e.clientX - dragState.offsetX) + 'px';
    dragState.el.style.top = (e.clientY - dragState.offsetY) + 'px';

    var hit = document.elementFromPoint(e.clientX, e.clientY);
    var target = hit && hit.closest ? hit.closest('.item-btn[data-id]') : null;
    if (!target) return;
    var overId = target.getAttribute('data-id');
    if (overId === dragState.id) return;
    var fromIdx = MENU.findIndex(function (m) { return m.id === dragState.id; });
    var toIdx = MENU.findIndex(function (m) { return m.id === overId; });
    if (fromIdx === -1 || toIdx === -1) return;
    var moved = MENU.splice(fromIdx, 1)[0];
    MENU.splice(toIdx, 0, moved);
    reflow(dragState.id);
  });

  document.addEventListener('pointerup', function () {
    if (!dragState) return;
    var el = dragState.el;
    var grid = document.getElementById('grid');
    grid.classList.remove('reordering');

    // Drop it into place with the same kind of animation the other tiles
    // got, instead of snapping straight back into the grid.
    var fromRect = el.getBoundingClientRect();
    el.style.position = '';
    el.style.left = '';
    el.style.top = '';
    el.style.width = '';
    el.style.height = '';
    el.style.margin = '';
    el.style.pointerEvents = '';
    el.classList.remove('dragging');
    var toRect = el.getBoundingClientRect();
    var dx = fromRect.left - toRect.left, dy = fromRect.top - toRect.top;
    if (dx || dy) {
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          el.style.transition = 'transform 220ms ease';
          el.style.transform = '';
        });
      });
    }
    dragState = null;

    fetch('/api/menu/reorder', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order: MENU.map(function (m) { return m.id; }) })
    }).catch(function () {});
  });

  function renderTicket() {
    var body = document.getElementById('ticketBody');
    body.innerHTML = '';
    var entries = Object.keys(cart).filter(function (k) { return cart[k] > 0; });
    if (entries.length === 0) {
      body.innerHTML = '<div class="ticket-empty">메뉴를 선택해주세요</div>';
      return;
    }
    entries.forEach(function (id) {
      var it = MENU.find(function (x) { return x.id === id; });
      if (!it) return;
      var qty = cart[id];
      var row = document.createElement('div');
      row.className = 'ticket-row';
      row.innerHTML =
        '<span class="emoji">' + it.emoji + '</span>' +
        '<span class="name"></span>' +
        '<span class="stepper">' +
          '<button data-act="dec" data-id="' + id + '">−</button>' +
          '<span class="qty">' + qty + '</span>' +
          '<button data-act="inc" data-id="' + id + '">+</button>' +
        '</span>' +
        '<span class="amount">' + fmt(it.price * qty) + '</span>';
      row.querySelector('.name').textContent = it.name;
      body.appendChild(row);
    });
    body.querySelectorAll('button[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-id');
        var act = b.getAttribute('data-act');
        if (act === 'inc') cart[id] = (cart[id] || 0) + 1;
        else cart[id] = Math.max(0, (cart[id] || 0) - 1);
        render();
      });
    });
  }

  function renderPay() {
    var row = document.getElementById('payRow');
    row.innerHTML = '';
    PAY_OPTIONS.forEach(function (p) {
      var chip = document.createElement('div');
      chip.className = 'pay-chip' + (payMethod === p ? ' selected' : '');
      var payIcon = p === '현금' ? '💵' : (p === '터치앤고' ? '📱' : '🙏');
      chip.innerHTML = '<span class="pay-chip-emoji"></span><span></span>';
      chip.querySelector('.pay-chip-emoji').textContent = payIcon;
      chip.querySelector('span:last-child').textContent = p;
      chip.addEventListener('click', function () { payMethod = p; render(); });
      row.appendChild(chip);
    });
  }

  function total() {
    return MENU.reduce(function (sum, it) { return sum + it.price * (cart[it.id] || 0); }, 0);
  }

  function renderFooter() {
    var t = total();
    document.getElementById('totalValue').textContent = fmt(t);
    var btn = document.getElementById('submitBtn');
    var ok = t > 0 && payMethod && !submitting;
    btn.classList.toggle('active', ok);
    btn.disabled = !ok;
  }

  function render() {
    renderGrid();
    renderTicket();
    renderPay();
    renderFooter();
    scheduleFitMenuGrid();
  }

  function showToast(msg, isError) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    t.className = 'toast' + (isError ? ' error' : '');
    setTimeout(function () { t.hidden = true; }, 2200);
  }

  async function submitOrder() {
    if (submitting) return;
    submitting = true; render();
    var items = Object.keys(cart).filter(function (k) { return cart[k] > 0; }).map(function (id) {
      var it = MENU.find(function (x) { return x.id === id; });
      return { id: id, name: it.name, price: it.price, qty: cart[id] };
    });
    try {
      var res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: items, total: total(), pay: payMethod, device: DEVICE_NAME })
      });
      if (!res.ok) throw new Error('save failed');
      showToast('주문이 저장됐어요 ✓');
      cart = {}; payMethod = null;
    } catch (e) {
      showToast('저장 실패 - 다시 시도해주세요', true);
    } finally {
      submitting = false; render();
    }
  }

  document.getElementById('clearBtn').addEventListener('click', function () {
    cart = {}; payMethod = null; render();
  });
  document.getElementById('submitBtn').addEventListener('click', submitOrder);

  function renderSummary(orders) {
    var summaryEl = document.getElementById('recentSummary');
    var totalRevenue = orders.reduce(function (s, o) { return s + o.total; }, 0);
    var counts = {}; // name -> { qty, amount }
    orders.forEach(function (o) {
      o.items.forEach(function (it) {
        if (!counts[it.name]) counts[it.name] = { qty: 0, amount: 0 };
        counts[it.name].qty += it.qty;
        counts[it.name].amount += it.price * it.qty;
      });
    });
    var names = Object.keys(counts).sort(function (a, b) { return counts[b].qty - counts[a].qty; });
    var rowsHtml = names.map(function (name) {
      return '<tr><td></td><td class="qty">' + counts[name].qty + '개</td><td class="amt">' + fmt(counts[name].amount) + '</td></tr>';
    }).join('');
    summaryEl.innerHTML =
      '<div class="big-total-label">오늘 전체 매출</div>' +
      '<div class="big-total">' + fmt(totalRevenue) + '</div>' +
      '<table class="item-count-table"><tbody>' + rowsHtml + '</tbody></table>';
    var nameCells = summaryEl.querySelectorAll('.item-count-table td:first-child');
    names.forEach(function (name, i) { nameCells[i].textContent = name; });
  }

  async function loadRecent() {
    var body = document.getElementById('recentBody');
    body.innerHTML = '<div class="recent-empty">불러오는 중...</div>';
    try {
      var res = await fetch('/api/orders?limit=50');
      var orders = await res.json();
      renderSummary(orders);
      if (orders.length === 0) {
        body.innerHTML = '<div class="recent-empty">오늘 주문이 아직 없어요</div>';
        return;
      }
      body.innerHTML = orders.map(function (o) {
        var time = window.cafeTime.hms(o.createdAt);
        var desc = o.items.map(function (i) { return i.name + ' x' + i.qty; }).join(', ');
        return '<div class="recent-row"><div class="top"><span>' + time + (o.pay ? ' · ' + o.pay : '') + '</span><span>' + fmt(o.total) + '</span></div><div class="desc"></div></div>';
      }).join('');
      // fill descriptions as text to avoid HTML injection from stored memo/item names
      var rows = body.querySelectorAll('.recent-row .desc');
      orders.forEach(function (o, i) {
        rows[i].textContent = o.items.map(function (it) { return it.name + ' x' + it.qty; }).join(', ');
      });
    } catch (e) {
      body.innerHTML = '<div class="recent-empty">불러오지 못했어요</div>';
    }
  }
  document.getElementById('recentRefresh').addEventListener('click', loadRecent);

  document.getElementById('navBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    document.getElementById('navMenu').hidden = !document.getElementById('navMenu').hidden;
  });
  document.addEventListener('click', function () {
    document.getElementById('navMenu').hidden = true;
  });

  document.querySelectorAll('.main-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.main-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      var view = tab.getAttribute('data-view');
      document.getElementById('view-order').hidden = view !== 'order';
      document.getElementById('view-history').hidden = view !== 'history';
      if (view === 'history') loadRecent();
    });
  });

  async function init() {
    var deviceLabelEl = document.getElementById('deviceLabel');
    deviceLabelEl.textContent = '📍 ' + DEVICE_NAME;
    deviceLabelEl.style.cursor = 'pointer';
    deviceLabelEl.title = '탭하면 기기 이름 변경';
    deviceLabelEl.addEventListener('click', function () {
      var next = (window.prompt('기기 이름 변경', DEVICE_NAME) || '').trim();
      if (next) {
        DEVICE_NAME = next;
        localStorage.setItem('cafe-device-name', next);
        deviceLabelEl.textContent = '📍 ' + DEVICE_NAME;
      }
    });
    var res = await fetch('/api/menu');
    MENU = await res.json();
    renderClock();
    setInterval(renderClock, 30000);
    render();
    if (window.cafeKeepAwake) window.cafeKeepAwake();
  }

  init();
</script>
</body>
</html>
