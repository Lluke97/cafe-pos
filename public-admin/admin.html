<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>주섬주섬 카페 관리자</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7a4a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주섬주섬 카페 관리자">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  .hidden { display: none !important; }
  .row-actions { display: flex; gap: 6px; }
  .menu-form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .menu-form-row .field { margin-bottom: 0; flex: 1; min-width: 110px; }
  .settings-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin: 16px; display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .settings-card .field { margin-bottom: 0; max-width: 200px; }
  .chip-toggle { display: flex; gap: 6px; margin: 16px 16px 0; }
  .chip-toggle .chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-muted); }
  .chip-toggle .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin: 10px 16px 0; }
  .menu-edit-row input { width: 100%; }
  .inline-save { color: var(--ok); }
  .settlement-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin: 16px; }
  .settlement-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .settlement-col { flex: 1; min-width: 140px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .settlement-label { font-size: 11px; color: var(--text-muted); }
  .settlement-value { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .settle-result-box { border-radius: 10px; padding: 12px; font-size: 13px; }
  .settle-result-box.ok { background: rgba(63,138,74,.15); color: var(--ok); }
  .settle-result-box.off { background: rgba(179,80,63,.15); color: var(--danger); }
  .diff-ok { color: var(--ok); }
  .diff-off { color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
<header>
  <h1>🛠️ 주섬주섬 카페 관리자</h1>
  <div class="header-right">
    <span id="clock"></span>
    <button id="themeBtn" title="테마 변경">🌓</button>
    <div class="nav-wrap">
      <button class="nav-btn" id="navBtn">☰</button>
      <div class="nav-menu" id="navMenu" hidden>
        <a href="/">🏠 홈</a>
        <a href="/pos.html">🧾 계산대</a>
        <a href="/brew.html">🍵 브루 보드</a>
        <a href="/entry.html">🧮 구매·지출 입력</a>
        <a href="/admin" class="current">🛠️ 관리자</a>
      </div>
    </div>
  </div>
</header>

<div class="admin-tabs">
  <div class="tab active" data-tab="summary">요약</div>
  <div class="tab" data-tab="orders">주문 내역</div>
  <div class="tab" data-tab="expenses">구매·지출</div>
  <div class="tab" data-tab="menu">메뉴 관리</div>
</div>

<section id="tab-summary" class="admin-section">
  <div class="kpi-row" id="todayKpis"></div>
  <div class="kpi-row" id="payKpis"></div>

  <div class="settlement-card" id="settlementCard">
    <h2 style="margin:0 0 10px; font-size:15px; font-weight:700;">💰 정산 (현금 · 터치앤고 실사)</h2>
    <div id="settlementSinceNote" style="font-size:12px; color:var(--text-muted); margin-bottom:10px;"></div>
    <div class="settlement-row">
      <div class="settlement-col">
        <div class="settlement-label">💵 시스템 집계 현금</div>
        <div class="settlement-value" id="recordedCash">RM0.00</div>
      </div>
      <div class="settlement-col">
        <div class="settlement-label">📱 시스템 집계 터치앤고</div>
        <div class="settlement-value" id="recordedTng">RM0.00</div>
      </div>
    </div>
    <div class="settlement-row" style="margin-top:12px;">
      <div class="field" style="flex:1;">
        <label>실제 현금 (세어본 금액)</label>
        <input type="number" id="actualCash" step="0.01" placeholder="예: 350.00">
      </div>
      <div class="field" style="flex:1;">
        <label>실제 터치앤고 (앱/명세 확인)</label>
        <input type="number" id="actualTng" step="0.01" placeholder="예: 420.00">
      </div>
    </div>
    <button id="settleBtn" class="btn btn-primary active" style="width:100%; margin-top:10px;">정산하기</button>
    <div id="settleResult" style="display:none; margin-top:12px;"></div>

    <div id="reportBox" style="display:none; margin-top:14px;">
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:6px;">📋 복사해서 보낼 주간 리포트</div>
      <textarea id="reportText" readonly style="width:100%; min-height:220px; font-family:inherit; font-size:13px; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); box-sizing:border-box;"></textarea>
      <button id="copyReportBtn" class="btn btn-primary active" style="width:100%; margin-top:8px;">📋 복사하기</button>
      <span id="copyReportDone" style="display:none; font-size:12px; color:var(--ok); margin-left:8px;">복사됐어요 ✓</span>
    </div>

    <div style="margin-top:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size:12px; color:var(--text-muted);">지난 정산 기록</span>
        <span id="regenReportBtn" class="clear" style="font-size:12px;">최근 리포트 다시 보기</span>
      </div>
      <table class="admin-table">
        <thead><tr><th>날짜</th><th>현금 차이</th><th>터치앤고 차이</th></tr></thead>
        <tbody id="settlementRows"></tbody>
      </table>
    </div>
  </div>

  <div class="chip-toggle" id="chartToggle">
    <div class="chip selected" data-mode="week">주간</div>
    <div class="chip" data-mode="month">월간</div>
  </div>
  <div class="chart-card">
    <canvas id="revenueChart" height="110"></canvas>
  </div>

  <table class="admin-table" style="margin:16px;">
    <thead><tr><th>날짜</th><th>매출</th><th>현금</th><th>터치앤고</th><th>Free</th><th>구매·지출</th><th>손익</th></tr></thead>
    <tbody id="summaryRows"></tbody>
  </table>
</section>

<section id="tab-orders" class="admin-section hidden">
  <div class="menu-form-row">
    <div class="field" style="max-width:200px"><label>날짜 필터</label><input type="date" id="ordersDate"></div>
    <button id="ordersCsvBtn" class="btn btn-secondary" style="flex:0 0 auto; padding:10px 16px;">⬇ 엑셀(CSV) 다운로드</button>
  </div>
  <table class="admin-table">
    <thead><tr><th>시간</th><th>내역</th><th>결제</th><th>기기</th><th>합계</th><th></th></tr></thead>
    <tbody id="ordersRows"></tbody>
  </table>
</section>

<section id="tab-expenses" class="admin-section hidden">
  <div class="menu-form-row">
    <div class="field" style="max-width:200px"><label>날짜 필터</label><input type="date" id="expensesDate"></div>
    <button id="expensesCsvBtn" class="btn btn-secondary" style="flex:0 0 auto; padding:10px 16px;">⬇ 엑셀(CSV) 다운로드</button>
  </div>
  <table class="admin-table">
    <thead><tr><th>날짜</th><th>카테고리</th><th>금액</th><th>메모</th><th>작성자</th><th></th></tr></thead>
    <tbody id="expensesRows"></tbody>
  </table>
</section>

<section id="tab-menu" class="admin-section hidden">
  <div class="menu-form-row">
    <div class="field">
      <label>이모지</label>
      <select id="mEmoji" style="width:120px"></select>
      <input id="mEmojiCustom" placeholder="이모지 직접 입력" style="width:120px; margin-top:6px; display:none;">
    </div>
    <div class="field"><label>이름</label><input id="mName" placeholder="예: Americano"></div>
    <div class="field"><label>카테고리</label><input id="mCategory" placeholder="예: 음료"></div>
    <div class="field"><label>가격 (RM)</label><input id="mPrice" type="number" step="0.01" placeholder="예: 6.00"></div>
    <button id="mAddBtn" class="btn btn-primary active" style="flex:0 0 auto; padding:10px 16px;">추가</button>
  </div>
  <table class="admin-table">
    <thead><tr><th></th><th>이름</th><th>카테고리</th><th>가격</th><th></th></tr></thead>
    <tbody id="menuRows"></tbody>
  </table>
</section>

<script>
  function fmt(n) {
    return 'RM' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function renderClock() {
    var d = new Date();
    document.getElementById('clock').textContent = window.cafeTime.hm(d);
  }
  renderClock(); setInterval(renderClock, 30000);

  document.getElementById('navBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    document.getElementById('navMenu').hidden = !document.getElementById('navMenu').hidden;
  });
  document.addEventListener('click', function () {
    document.getElementById('navMenu').hidden = true;
  });

  document.querySelectorAll('.admin-tabs .tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.admin-tabs .tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      document.querySelectorAll('.admin-section').forEach(function (s) { s.classList.add('hidden'); });
      document.getElementById('tab-' + tab.getAttribute('data-tab')).classList.remove('hidden');
    });
  });

  async function api(path, opts) {
    var res = await fetch(path, opts);
    if (!res.ok) throw new Error('request failed: ' + path);
    return res.json();
  }

  var lastDays = [];
  var chartMode = 'week';
  var chartInstance = null;

  // ---------- 정산 (cash / Touch 'n Go settlement) ----------
  async function loadSettlementStatus() {
    var s = await api('/api/admin/settlement-status');
    document.getElementById('recordedCash').textContent = fmt(s.recordedCash);
    document.getElementById('recordedTng').textContent = fmt(s.recordedTng);
    document.getElementById('settlementSinceNote').textContent = s.since
      ? ('마지막 정산: ' + s.since + ' (그 이후 집계된 금액이에요)')
      : '아직 정산한 적 없음 — 전체 기간 집계예요. 실제 센 금액을 입력하고 정산하기를 눌러주세요.';
    // Prefill with the system's recorded amount so the owner only has to
    // correct it if the real count differs.
    document.getElementById('actualCash').value = s.recordedCash.toFixed(2);
    document.getElementById('actualTng').value = s.recordedTng.toFixed(2);
  }

  function diffHtml(label, diff) {
    var cls = Math.abs(diff) < 0.01 ? 'diff-ok' : 'diff-off';
    var text = Math.abs(diff) < 0.01 ? '일치 ✓' : (diff > 0 ? '+' + fmt(diff) + ' (실제가 더 많음)' : fmt(diff) + ' (실제가 더 적음)');
    return '<div>' + label + ': <span class="' + cls + '">' + text + '</span></div>';
  }

  // ---------- 복사용 주간 리포트 ----------
  async function buildReport(record) {
    var since = record.since; // null, or the previous settlement's date (exclusive)
    var to = record.date;
    var qs = (since ? ('from=' + encodeURIComponent(since) + '&') : '') + 'to=' + encodeURIComponent(to);
    var expenses = await api('/api/admin/expenses?' + qs);
    var ordersInRange = await api('/api/admin/orders?' + qs);
    var summary = await api('/api/admin/summary');

    var itemCounts = {}; // name -> { qty, amount }
    ordersInRange.forEach(function (o) {
      o.items.forEach(function (it) {
        if (!itemCounts[it.name]) itemCounts[it.name] = { qty: 0, amount: 0 };
        itemCounts[it.name].qty += it.qty;
        itemCounts[it.name].amount += it.price * it.qty;
      });
    });
    var itemNames = Object.keys(itemCounts).sort(function (a, b) { return itemCounts[b].qty - itemCounts[a].qty; });
    var totalCups = itemNames.reduce(function (s, n) { return s + itemCounts[n].qty; }, 0);
    var daysInRange = summary.filter(function (d) { return (!since || d.date > since) && d.date <= to; });
    var freeTotal = daysInRange.reduce(function (s, d) { return s + (d.free || 0); }, 0);

    var byCat = {};
    var catOrder = [];
    expenses.forEach(function (e) {
      if (!(e.category in byCat)) { byCat[e.category] = 0; catOrder.push(e.category); }
      byCat[e.category] += e.amount;
    });
    var expenseTotal = expenses.reduce(function (s, e) { return s + e.amount; }, 0);
    var revenueTotal = record.recordedCash + record.recordedTng;
    var profit = revenueTotal - expenseTotal;

    var lines = [];
    lines.push('☕ 주섬주섬 카페 주간 정산 (' + (since ? (since + ' ~ ') : '') + to + ')');
    lines.push('');
    lines.push('[매출]');
    lines.push('현금: ' + fmt(record.recordedCash));
    lines.push('터치앤고: ' + fmt(record.recordedTng));
    lines.push('매출 합계: ' + fmt(revenueTotal));
    if (freeTotal > 0) lines.push('(참고) Free 제공 — 매출 미포함: ' + fmt(freeTotal));
    lines.push('');
    lines.push('[메뉴별 판매] 총 ' + totalCups + '잔');
    if (itemNames.length === 0) lines.push('내역 없음');
    itemNames.forEach(function (name) {
      lines.push('- ' + name + ': ' + itemCounts[name].qty + '잔 (' + fmt(itemCounts[name].amount) + ')');
    });
    lines.push('');
    lines.push('[구매·지출]');
    if (catOrder.length === 0) lines.push('내역 없음');
    catOrder.forEach(function (cat) { lines.push(cat + ': ' + fmt(byCat[cat])); });
    lines.push('지출 합계: ' + fmt(expenseTotal));
    lines.push('');
    lines.push('손익: ' + fmt(profit));
    lines.push('');
    lines.push('[정산 확인 — 실사 결과]');
    lines.push('실제 현금: ' + fmt(record.actualCash) + (Math.abs(record.diffCash) < 0.01 ? ' (일치 ✓)' : (' (차이 ' + fmt(record.diffCash) + ')')));
    lines.push('실제 터치앤고: ' + fmt(record.actualTng) + (Math.abs(record.diffTng) < 0.01 ? ' (일치 ✓)' : (' (차이 ' + fmt(record.diffTng) + ')')));

    document.getElementById('reportText').value = lines.join('\n');
    document.getElementById('reportBox').style.display = 'block';
  }

  document.getElementById('copyReportBtn').addEventListener('click', async function () {
    var text = document.getElementById('reportText').value;
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      var ta = document.getElementById('reportText');
      ta.focus(); ta.select();
      document.execCommand('copy');
    }
    var done = document.getElementById('copyReportDone');
    done.style.display = 'inline';
    setTimeout(function () { done.style.display = 'none'; }, 2000);
  });

  document.getElementById('regenReportBtn').addEventListener('click', async function () {
    var list = await api('/api/admin/settlements');
    if (list.length === 0) return alert('정산 기록이 아직 없어요');
    buildReport(list[0]);
  });

  document.getElementById('settleBtn').addEventListener('click', async function () {
    var actualCash = parseFloat(document.getElementById('actualCash').value);
    var actualTng = parseFloat(document.getElementById('actualTng').value);
    if (Number.isNaN(actualCash) || Number.isNaN(actualTng)) return alert('실제 현금과 터치앤고 금액을 입력해주세요');
    var res = await fetch('/api/admin/settlement', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ actualCash: actualCash, actualTng: actualTng })
    });
    var record = await res.json();
    var box = document.getElementById('settleResult');
    var allOk = Math.abs(record.diffCash) < 0.01 && Math.abs(record.diffTng) < 0.01;
    box.className = 'settle-result-box ' + (allOk ? 'ok' : 'off');
    box.innerHTML = (allOk ? '✓ 정산 완료 — 전부 일치해요' : '⚠ 정산 완료 — 차이가 있어요') +
      diffHtml('현금', record.diffCash) + diffHtml('터치앤고', record.diffTng);
    box.style.display = 'block';
    loadSettlementStatus();
    loadSettlementHistory();
    buildReport(record);
  });

  async function loadSettlementHistory() {
    var list = await api('/api/admin/settlements');
    document.getElementById('settlementRows').innerHTML = list.slice(0, 10).map(function (r) {
      return '<tr><td>' + r.date + '</td>' +
        '<td class="' + (Math.abs(r.diffCash) < 0.01 ? 'diff-ok' : 'diff-off') + '">' + fmt(r.diffCash) + '</td>' +
        '<td class="' + (Math.abs(r.diffTng) < 0.01 ? 'diff-ok' : 'diff-off') + '">' + fmt(r.diffTng) + '</td></tr>';
    }).join('') || '<tr><td colspan="3">정산 기록 없음</td></tr>';
  }

  // ---------- Summary ----------
  function isoWeekLabel(dateStr) {
    var d = new Date(dateStr + 'T00:00:00Z');
    var day = (d.getUTCDay() + 6) % 7; // Monday = 0
    d.setUTCDate(d.getUTCDate() - day);
    var mm = String(d.getUTCMonth() + 1).padStart(2, '0');
    var dd = String(d.getUTCDate()).padStart(2, '0');
    return mm + '/' + dd + ' 주';
  }
  function monthLabel(dateStr) { return dateStr.slice(0, 7); }

  function aggregate(days, mode) {
    var buckets = {};
    var order = [];
    days.slice().reverse().forEach(function (d) { // ascending for chart order
      var key = mode === 'week' ? isoWeekLabel(d.date) : monthLabel(d.date);
      if (!buckets[key]) { buckets[key] = { revenue: 0, cost: 0 }; order.push(key); }
      buckets[key].revenue += d.revenue;
      buckets[key].cost += d.cost;
    });
    return {
      labels: order,
      revenue: order.map(function (k) { return buckets[k].revenue; }),
      cost: order.map(function (k) { return buckets[k].cost; })
    };
  }

  function renderChart() {
    var agg = aggregate(lastDays, chartMode);
    var ctx = document.getElementById('revenueChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: agg.labels,
        datasets: [
          { label: '매출', data: agg.revenue, backgroundColor: '#7a4a2b' },
          { label: '구매·지출', data: agg.cost, backgroundColor: '#cfa98b' }
        ]
      },
      options: {
        responsive: true,
        scales: { y: { beginAtZero: true } },
        plugins: { legend: { position: 'bottom' } }
      }
    });
  }

  document.querySelectorAll('#chartToggle .chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      document.querySelectorAll('#chartToggle .chip').forEach(function (c) { c.classList.remove('selected'); });
      chip.classList.add('selected');
      chartMode = chip.getAttribute('data-mode');
      renderChart();
    });
  });

  async function loadSummary() {
    var days = await api('/api/admin/summary');
    lastDays = days;
    var today = window.cafeTime.ymd(new Date());
    var t = days.find(function (d) { return d.date === today; }) || { revenue: 0, cost: 0, profit: 0, cash: 0, tng: 0 };

    document.getElementById('todayKpis').innerHTML =
      '<div class="kpi-card"><div class="label">오늘 매출</div><div class="value">' + fmt(t.revenue) + '</div></div>' +
      '<div class="kpi-card"><div class="label">오늘 구매·지출</div><div class="value">' + fmt(t.cost) + '</div></div>' +
      '<div class="kpi-card"><div class="label">오늘 손익</div><div class="value">' + fmt(t.profit) + '</div></div>';

    document.getElementById('payKpis').innerHTML =
      '<div class="kpi-card"><div class="label">💵 오늘 현금 매출</div><div class="value">' + fmt(t.cash) + '</div></div>' +
      '<div class="kpi-card"><div class="label">📱 오늘 터치앤고 매출</div><div class="value">' + fmt(t.tng || 0) + '</div></div>' +
      '<div class="kpi-card"><div class="label">🙏 오늘 Free 제공</div><div class="value">' + fmt(t.free || 0) + '</div></div>';

    document.getElementById('summaryRows').innerHTML = days.map(function (d) {
      return '<tr><td>' + d.date + '</td><td>' + fmt(d.revenue) + '</td><td>' + fmt(d.cash) + '</td><td>' + fmt(d.tng) + '</td>' +
        '<td>' + fmt(d.free || 0) + '</td><td>' + fmt(d.cost) + '</td><td>' + fmt(d.profit) + '</td></tr>';
    }).join('') || '<tr><td colspan="7">데이터 없음</td></tr>';

    renderChart();
  }

  // ---------- CSV export ----------
  function downloadCsv(filename, rows) {
    var csv = rows.map(function (row) {
      return row.map(function (cell) {
        var s = String(cell == null ? '' : cell);
        if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
        return s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  var lastOrders = [];
  var lastExpenses = [];

  document.getElementById('ordersCsvBtn').addEventListener('click', function () {
    var rows = [['날짜', '시간', '전체 타임스탬프(UTC)', '내역', '결제수단', '기기', '합계(RM)', '상태']];
    lastOrders.forEach(function (o) {
      var desc = o.items.map(function (i) { return i.name + ' x' + i.qty; }).join(', ');
      rows.push([
        window.cafeTime.ymd(o.createdAt), window.cafeTime.hms(o.createdAt), o.createdAt,
        desc, o.pay || '', o.device || '', o.total, o.status || ''
      ]);
    });
    downloadCsv('주문내역_' + window.cafeTime.ymd(new Date()) + '.csv', rows);
  });

  document.getElementById('expensesCsvBtn').addEventListener('click', function () {
    var rows = [['날짜', '카테고리', '금액(RM)', '메모', '작성자']];
    lastExpenses.forEach(function (e) {
      rows.push([e.date, e.category, e.amount, e.memo || '', e.author || '']);
    });
    downloadCsv('구매지출내역_' + window.cafeTime.ymd(new Date()) + '.csv', rows);
  });

  // ---------- Orders ----------
  async function loadOrders() {
    var dateVal = document.getElementById('ordersDate').value;
    var qs = dateVal ? ('?date=' + dateVal) : '';
    var orders = await api('/api/admin/orders' + qs);
    lastOrders = orders;
    document.getElementById('ordersRows').innerHTML = orders.map(function (o) {
      var desc = o.items.map(function (i) { return i.name + ' x' + i.qty; }).join(', ');
      var time = window.cafeTime.hms(o.createdAt);
      return '<tr><td>' + time + '</td><td>' + desc + '</td><td>' + (o.pay || '-') + '</td><td>' + (o.device || '-') + '</td><td>' + fmt(o.total) + '</td>' +
        '<td><button class="btn-small btn-danger" data-id="' + o.id + '">삭제</button></td></tr>';
    }).join('') || '<tr><td colspan="6">주문 없음</td></tr>';
    document.querySelectorAll('#ordersRows button').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('이 주문을 삭제할까요?')) return;
        await fetch('/api/admin/orders/' + b.getAttribute('data-id'), { method: 'DELETE' });
        loadOrders(); loadSummary();
      });
    });
  }
  document.getElementById('ordersDate').addEventListener('change', loadOrders);

  // ---------- Expenses ----------
  async function loadExpenses() {
    var dateVal = document.getElementById('expensesDate').value;
    var qs = dateVal ? ('?date=' + dateVal) : '';
    var expenses = await api('/api/admin/expenses' + qs);
    lastExpenses = expenses;
    document.getElementById('expensesRows').innerHTML = expenses.map(function (e) {
      return '<tr><td>' + e.date + '</td><td>' + e.category + '</td><td>' + fmt(e.amount) + '</td><td>' + (e.memo || '-') + '</td><td>' + (e.author || '-') + '</td>' +
        '<td><button class="btn-small btn-danger" data-id="' + e.id + '">삭제</button></td></tr>';
    }).join('') || '<tr><td colspan="6">내역 없음</td></tr>';
    document.querySelectorAll('#expensesRows button').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('이 내역을 삭제할까요?')) return;
        await fetch('/api/admin/expenses/' + b.getAttribute('data-id'), { method: 'DELETE' });
        loadExpenses(); loadSummary();
      });
    });
  }
  document.getElementById('expensesDate').addEventListener('change', loadExpenses);

  // ---------- Menu (with inline edit) ----------
  var EMOJI_OPTIONS = [
    ['☕', '☕ 커피'], ['🧊☕', '🧊☕ 아이스커피'], ['🧊🥛', '🧊🥛 아이스라떼'], ['🥛', '🥛 우유/라떼'],
    ['🍵', '🍵 차'], ['🧋', '🧋 버블티'], ['🥤', '🥤 음료'], ['🧃', '🧃 주스팩'], ['🍊', '🍊 오렌지주스'],
    ['🍓', '🍓 딸기'], ['🍫', '🍫 초콜릿'], ['🍪', '🍪 쿠키'], ['🧁', '🧁 컵케이크'], ['🍰', '🍰 케이크'],
    ['🥐', '🥐 크루아상'], ['🥯', '🥯 베이글'], ['🍩', '🍩 도넛'], ['🥧', '🥧 파이'], ['🍯', '🍯 꿀'],
    ['🍦', '🍦 아이스크림'], ['🍽️', '🍽️ 기타']
  ];

  function populateEmojiSelect(selectEl, currentValue) {
    selectEl.innerHTML = '';
    EMOJI_OPTIONS.forEach(function (pair) {
      var opt = document.createElement('option');
      opt.value = pair[0];
      opt.textContent = pair[1];
      selectEl.appendChild(opt);
    });
    var customOpt = document.createElement('option');
    customOpt.value = '__custom__';
    customOpt.textContent = '✏️ 직접 입력';
    selectEl.appendChild(customOpt);

    var known = EMOJI_OPTIONS.some(function (p) { return p[0] === currentValue; });
    if (currentValue && !known) {
      selectEl.value = '__custom__';
    } else if (currentValue) {
      selectEl.value = currentValue;
    }
  }

  populateEmojiSelect(document.getElementById('mEmoji'), '☕');
  document.getElementById('mEmoji').addEventListener('change', function () {
    var customInput = document.getElementById('mEmojiCustom');
    if (this.value === '__custom__') {
      customInput.style.display = '';
      customInput.focus();
    } else {
      customInput.style.display = 'none';
    }
  });
  function readEmojiValue(selectEl, customEl) {
    if (selectEl.value === '__custom__') return (customEl.value || '').trim() || '🍽️';
    return selectEl.value || '🍽️';
  }

  var menuCache = [];

  function menuRowHtml(m) {
    return '<tr data-id="' + m.id + '">' +
      '<td>' + m.emoji + '</td><td>' + m.name + '</td><td>' + m.category + '</td><td>' + fmt(m.price) + '</td>' +
      '<td class="row-actions">' +
        '<button class="btn-small" data-edit="' + m.id + '">수정</button>' +
        '<button class="btn-small btn-danger" data-del="' + m.id + '">삭제</button>' +
      '</td></tr>';
  }

  function menuEditRowHtml(m) {
    return '<tr data-id="' + m.id + '" class="menu-edit-row">' +
      '<td>' +
        '<select data-f="emoji" style="width:120px"></select>' +
        '<input data-f="emojiCustom" placeholder="직접 입력" style="width:100px; margin-top:4px; display:none;">' +
      '</td>' +
      '<td><input value="' + m.name.replace(/"/g, '&quot;') + '" data-f="name"></td>' +
      '<td><input value="' + m.category.replace(/"/g, '&quot;') + '" data-f="category"></td>' +
      '<td><input type="number" step="0.01" value="' + m.price + '" data-f="price" style="width:80px"></td>' +
      '<td class="row-actions">' +
        '<button class="btn-small inline-save" data-save="' + m.id + '">저장</button>' +
        '<button class="btn-small" data-cancel="' + m.id + '">취소</button>' +
      '</td></tr>';
  }

  function bindMenuRowEvents() {
    document.querySelectorAll('#menuRows button[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-edit');
        var m = menuCache.find(function (x) { return x.id === id; });
        var tr = document.querySelector('#menuRows tr[data-id="' + id + '"]');
        tr.outerHTML = menuEditRowHtml(m);
        var newTr = document.querySelector('#menuRows tr[data-id="' + id + '"]');
        var sel = newTr.querySelector('[data-f="emoji"]');
        var custom = newTr.querySelector('[data-f="emojiCustom"]');
        populateEmojiSelect(sel, m.emoji);
        if (sel.value === '__custom__') { custom.style.display = ''; custom.value = m.emoji; }
        sel.addEventListener('change', function () {
          if (sel.value === '__custom__') { custom.style.display = ''; custom.focus(); }
          else { custom.style.display = 'none'; }
        });
        bindMenuRowEvents();
      });
    });
    document.querySelectorAll('#menuRows button[data-cancel]').forEach(function (b) {
      b.addEventListener('click', function () { renderMenuTable(); });
    });
    document.querySelectorAll('#menuRows button[data-save]').forEach(function (b) {
      b.addEventListener('click', async function () {
        var id = b.getAttribute('data-save');
        var tr = document.querySelector('#menuRows tr[data-id="' + id + '"]');
        var emoji = readEmojiValue(tr.querySelector('[data-f="emoji"]'), tr.querySelector('[data-f="emojiCustom"]'));
        var name = tr.querySelector('[data-f="name"]').value.trim();
        var category = tr.querySelector('[data-f="category"]').value.trim() || '기타';
        var price = parseFloat(tr.querySelector('[data-f="price"]').value);
        if (!name || !price) return alert('이름과 가격을 입력해주세요');
        await fetch('/api/admin/menu/' + id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, emoji: emoji, category: category, price: price })
        });
        loadMenu();
      });
    });
    document.querySelectorAll('#menuRows button[data-del]').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('이 메뉴를 삭제할까요?')) return;
        await fetch('/api/admin/menu/' + b.getAttribute('data-del'), { method: 'DELETE' });
        loadMenu();
      });
    });
  }

  function renderMenuTable() {
    document.getElementById('menuRows').innerHTML = menuCache.map(menuRowHtml).join('') || '<tr><td colspan="5">메뉴 없음</td></tr>';
    bindMenuRowEvents();
  }

  async function loadMenu() {
    menuCache = await api('/api/admin/menu');
    renderMenuTable();
  }

  document.getElementById('mAddBtn').addEventListener('click', async function () {
    var name = document.getElementById('mName').value.trim();
    var price = parseFloat(document.getElementById('mPrice').value);
    var category = document.getElementById('mCategory').value.trim() || '기타';
    var emoji = readEmojiValue(document.getElementById('mEmoji'), document.getElementById('mEmojiCustom'));
    if (!name || !price) return alert('이름과 가격을 입력해주세요');
    await fetch('/api/admin/menu', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, price: price, category: category, emoji: emoji })
    });
    document.getElementById('mName').value = '';
    document.getElementById('mPrice').value = '';
    document.getElementById('mCategory').value = '';
    document.getElementById('mEmoji').value = '☕';
    document.getElementById('mEmojiCustom').value = '';
    document.getElementById('mEmojiCustom').style.display = 'none';
    loadMenu();
  });

  loadSettlementStatus();
  loadSettlementHistory();
  loadSummary();
  loadOrders();
  loadExpenses();
  loadMenu();
</script>
</body>
</html>
